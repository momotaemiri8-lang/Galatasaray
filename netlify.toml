# Netlify Configuration for Galatasaray SK Digital Platform
#
# 1. Build Settings (when connected to a repository or Netlify CLI)
[build]
  command = "npm run build"
  publish = "dist"

# 2. Map API telemetry endpoints to static JSON payloads
[[redirects]]
  from = "/api/bootstrap"
  to = "/api/bootstrap.json"
  status = 200

[[redirects]]
  from = "/api/squad/sync-telemetry"
  to = "/api/squad/sync-telemetry.json"
  status = 200

[[redirects]]
  from = "/api/performance-chat"
  to = "/api/performance-chat.json"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/api/health.json"
  status = 200

# 3. Single-Page Application (SPA) routing fallback for non-API routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 4. HTTP Headers for API responses and static assets
[[headers]]
  for = "/api/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, Accept"
    Cache-Control = "public, max-age=0, must-revalidate"

