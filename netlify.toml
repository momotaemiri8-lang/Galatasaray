# Netlify Configuration for Galatasaray SK Digital Platform
#
# 1. Build Settings (when connected to a repository or Netlify CLI)
[build]
  command = "npm run build"
  publish = "dist"

# 2. Proxy all /api/* requests to the live Cloud Run Express + PostgreSQL backend
#    so relative /api/* calls never hit Netlify's static 404 or SPA HTML fallback.
[[redirects]]
  from = "/api/*"
  to = "https://ais-pre-2ogzxwcpbrpxkhvs5esgzn-97089877236.europe-west2.run.app/api/:splat"
  status = 200
  force = true

# 3. Single-Page Application (SPA) routing fallback for non-API routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
